
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bad Bank React</title>

  <!-- Bootstrap CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
  >

  <!-- React 17 -->
  <script
    crossorigin
    src="https://unpkg.com/react@17/umd/react.development.js">
  </script>

  <!-- ReactDOM 17 -->
  <script
    crossorigin
    src="https://unpkg.com/react-dom@17/umd/react-dom.development.js">
  </script>

  <!-- React Router v5 -->
  <script src="https://unpkg.com/react-router@5/umd/react-router.min.js"></script>
  <script src="https://unpkg.com/react-router-dom@5/umd/react-router-dom.min.js"></script>

  <!-- Babel to support JSX in JavaScript files -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
  <!-- React application renders inside this element -->
  <div id="root"></div>

  <!-- jQuery and Bootstrap JavaScript -->
  <script
    src="https://code.jquery.com/jquery-3.5.1.slim.min.js">
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js">
  </script>

  <!-- Bad Bank application files -->
  <!-- Load context before components that use it -->
  <script type="text/babel" src="context.js"></script>
  <script type="text/babel" src="navbar.js"></script>
  <script type="text/babel" src="createaccount.js"></script>
  <script type="text/babel" src="login.js"></script>
  <script type="text/babel" src="deposit.js"></script>
  <script type="text/babel" src="withdraw.js"></script>
  <script type="text/babel" src="balance.js"></script>
  <script type="text/babel" src="alldata.js"></script>
  <script type="text/babel" src="home.js"></script>
  <script type="text/babel" src="index.js"></script>
</body>
</html>
